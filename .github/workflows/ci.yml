# 標準CI呼び出し（実体: https://github.com/sinoda1114/ci-standard）
# CI専用の環境変数は .github/ci.env に置く（標準CIが自動読み込み）。
# このファイルを対象リポジトリの .github/workflows/ci.yml に置く。
# 中身の実体は sinoda1114/ci-standard 側にあり、標準の改善は全リポジトリへ自動反映される。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同一refに新しいpushが来たら進行中の旧ジョブをキャンセル（無駄打ち防止）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# `secrets: inherit` は付けない（Amazon Q の指摘を検証して採用）。
# 呼び出し先の node-ci.yml は `secrets.*` を一切参照しておらず（実物を確認済み）、
# CIに必要な値は非シークレットの .github/ci.env から供給される。
# inherit を付けると使いもしないワークフローへ全シークレット（Turso のトークン等）が
# 渡るだけなので、最小権限のため外す。呼び出し先が将来シークレットを必要としたら、
# inherit ではなく `secrets:` マップで必要なものだけを明示的に渡すこと。
jobs:
  ci:
    uses: sinoda1114/ci-standard/.github/workflows/node-ci.yml@main
