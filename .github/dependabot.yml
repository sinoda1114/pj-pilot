version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # `@mantine/charts` の peerDependencies は `@mantine/core` / `@mantine/hooks` の
      # **バージョン完全一致**（`9.5.1` のように範囲ではなく固定）を要求する。
      # 個別のPRで片方だけ上がると peer が壊れて `npm ci` が失敗するため、
      # Mantine 系は必ず1つのPRにまとめて上げる（Phase 2 リスク R-5）。
      mantine:
        patterns:
          - "@mantine/*"
      # dnd-kit も core / sortable / utilities が相互に peer を張っているため、
      # まとめて上げる（`@dnd-kit/sortable` は `@dnd-kit/core ^6.3.0` を要求）。
      dnd-kit:
        patterns:
          - "@dnd-kit/*"
    ignore:
      # eslint-config-next@16.3.0 が内部で束ねる eslint-plugin-react が
      # ESLint 10 の新しいルール API に未対応（`contextOrFilename.getFilename is not a function`
      # で lint が全面的に落ちる）。upstream が追随するまで major バンプを止める。
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      # typescript-eslint が TypeScript 7.0（新しいネイティブコンパイラ系）に未対応
      # （"typescript-eslint does not support TS 7.0" で lint が起動時に落ちる）。
      # 追跡: https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
